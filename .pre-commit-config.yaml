# Install once:  pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^mkdocs\.yml$ # mkdocs uses python-specific yaml tags
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-PyYAML]
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: local
    hooks:
      # The architectural contracts are cheap to check and expensive to
      # rediscover in review. See .importlinter for what they assert.
      - id: import-linter
        name: architectural import contracts
        entry: env/bin/lint-imports
        language: system
        pass_filenames: false
        files: ^runner/.*\.py$
