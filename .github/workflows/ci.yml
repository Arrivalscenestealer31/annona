name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint · types · contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Lint
        run: python -m ruff check runner tests

      - name: Format check
        run: python -m ruff format --check runner tests

      - name: Types
        run: python -m mypy

      # Enforces the layering claims in docs/design/sovereign-runtime.md.
      # A failure here is an architecture regression, not a style nit.
      - name: Architectural contracts
        run: lint-imports

  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Test
        run: python -m pytest --cov=runner --cov-report=xml

      - name: Offline end-to-end run
        # Proves the runner boots and completes a real agentic loop with no
        # credentials and no network access.
        run: python -m runner.demo --check

  image:
    name: container · arm64 + amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The appliance target is a DGX Spark, which is arm64. An image that only
      # builds for amd64 fails on the customer's hardware and nowhere else, so
      # both architectures are built on every push rather than at release time.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds proves nothing an operator cares about. Load the
      # native image and exercise it: unprivileged user, policy on a volume,
      # ledger tamper-evidence, placement inside the container.
      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: annona:dev
          cache-from: type=gha

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Container acceptance tests
        env:
          ANNONA_CONTAINER_TESTS: "1"
        run: python -m pytest -m container -v

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict
