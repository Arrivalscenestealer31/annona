name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint · types · contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Lint
        run: python -m ruff check runner tests

      - name: Format check
        run: python -m ruff format --check runner tests

      - name: Types
        run: python -m mypy

      # Enforces the layering claims in docs/design/sovereign-runtime.md.
      # A failure here is an architecture regression, not a style nit.
      - name: Architectural contracts
        run: lint-imports

  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Test
        run: python -m pytest --cov=runner --cov-report=xml

      - name: Offline end-to-end run
        # Proves the runner boots and completes a real agentic loop with no
        # credentials and no network access.
        run: python -m runner.demo --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict
